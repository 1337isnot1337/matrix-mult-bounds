name: Verify research artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run all regression and archive-integrity tests
        run: python -m unittest discover -s tests -v

  replay:
    name: Archive replay (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Replay all five archived experiments
        run: python tools/replay.py

  ci:
    # Keep this name stable: the main-branch ruleset requires this check.
    name: CI
    if: ${{ always() }}
    needs: [tests, replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every verification job to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          if [ "$TESTS_RESULT" != "success" ] || [ "$REPLAY_RESULT" != "success" ]; then
            echo "::error::Verification did not pass: tests=$TESTS_RESULT, replay=$REPLAY_RESULT"
            exit 1
          fi
