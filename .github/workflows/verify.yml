name: Verify research artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      replay: ${{ steps.select.outputs.replay }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select conservative affected tests
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci_select.py --event --github-output "$GITHUB_OUTPUT"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Select and run required regression tests
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/ci_select.py --event
          python tools/ci_select.py --run

  replay:
    needs: plan
    if: ${{ needs.plan.outputs.replay == 'true' }}
    name: Archive replay (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Replay all five archived experiments
        run: python tools/replay.py

  ci:
    # Keep this name stable: the main-branch ruleset requires this check.
    name: CI
    if: ${{ always() }}
    needs: [plan, tests, replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every verification job to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REPLAY_REQUIRED: ${{ needs.plan.outputs.replay }}
          TESTS_RESULT: ${{ needs.tests.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ] || [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::Required plan/tests did not pass"
            exit 1
          fi
          if [ "$REPLAY_REQUIRED" = "true" ]; then
            test "$REPLAY_RESULT" = "success"
          else
            test "$REPLAY_RESULT" = "skipped" || test "$REPLAY_RESULT" = "success"
          fi
