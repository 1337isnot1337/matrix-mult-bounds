name: Verify research artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }}, group ${{ matrix.shard-index }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        shard-index: [0, 1, 2, 3]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run this group of regression and archive-integrity tests
        run: python tools/test_shard.py --shard-index ${{ matrix.shard-index }} --shard-count 4

  replay:
    name: Archive replay (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the maintained verification dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Replay all five archived experiments
        run: python tools/replay.py

  lean:
    name: Lean scalar-profile lemma
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Lean toolchain manager
        shell: bash
        run: |
          installer_dir="$RUNNER_TEMP/scalar-profile-elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$installer_dir/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $installer_dir/elan.tar.gz" | sha256sum --check
          tar -xzf "$installer_dir/elan.tar.gz" -C "$installer_dir"
          "$installer_dir/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean formalization
        working-directory: formal/scalar-profile
        shell: bash
        run: |
          lean --version
          lake exe cache get
          lake build

  ci:
    # Keep this name stable: the main-branch ruleset requires this check.
    name: CI
    if: ${{ always() }}
    needs: [tests, replay, lean]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every verification job to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          REPLAY_RESULT: ${{ needs.replay.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
        run: |
          if [ "$TESTS_RESULT" != "success" ] || [ "$REPLAY_RESULT" != "success" ] || [ "$LEAN_RESULT" != "success" ]; then
            echo "::error::Verification did not pass: tests=$TESTS_RESULT, replay=$REPLAY_RESULT, lean=$LEAN_RESULT"
            exit 1
          fi
